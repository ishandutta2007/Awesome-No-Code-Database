<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="badgeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="badgeGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45" />
      <circle cx="40" cy="0" r="1.2" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(-1deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes dataStream {
        0% { transform: translateY(0); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateY(120px); opacity: 0; }
      }

      .pulse-bg {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-pill-1 {
        animation: floatSlow1 6s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatSlow2 7s ease-in-out infinite;
      }
      .flowing-line {
        stroke-dasharray: 8, 8;
        animation: dashMove 3s linear infinite;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .text-pill {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Ambient Lights in Background -->
  <g class="pulse-bg">
    <circle cx="200" cy="100" r="140" fill="#3b82f6" fill-opacity="0.18" filter="url(#softGlow)" />
    <circle cx="1020" cy="320" r="160" fill="#8b5cf6" fill-opacity="0.15" filter="url(#softGlow)" />
    <circle cx="600" cy="210" r="180" fill="#0284c7" fill-opacity="0.12" filter="url(#softGlow)" />
  </g>

  <!-- Subtle Tech Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Circuit / Data Flow Lines in Background -->
  <g opacity="0.4">
    <path class="flowing-line" d="M 60,80 L 240,80 L 290,140" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="60" cy="80" r="3.5" fill="#38bdf8" />
    
    <path class="flowing-line" d="M 1140,80 L 960,80 L 910,140" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="1140" cy="80" r="3.5" fill="#c084fc" />

    <path class="flowing-line" d="M 120,360 L 320,360 L 370,300" fill="none" stroke="#34d399" stroke-width="1.5" />
    <circle cx="120" cy="360" r="3.5" fill="#34d399" />

    <path class="flowing-line" d="M 1080,360 L 880,360 L 830,300" fill="none" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="1080" cy="360" r="3.5" fill="#fbbf24" />
  </g>

  <!-- Dynamic Peripheral Floating Pills (Positioned safely away from center title) -->
  <!-- Top Left Pill -->
  <g class="floating-pill-1" transform="translate(65, 45)">
    <rect width="180" height="34" rx="17" fill="url(#badgeGrad1)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="4.5" fill="#60a5fa" />
    <text x="34" y="21" fill="#93c5fd" class="text-pill">POSTGRESQL NATIVE</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-pill-2" transform="translate(85, 335)">
    <rect width="170" height="34" rx="17" fill="url(#badgeGrad2)" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="4.5" fill="#34d399" />
    <text x="34" y="21" fill="#a7f3d0" class="text-pill">SELF-HOSTED READY</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-pill-2" transform="translate(950, 45)">
    <rect width="185" height="34" rx="17" fill="url(#badgeGrad3)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="4.5" fill="#c084fc" />
    <text x="34" y="21" fill="#ddd6fe" class="text-pill">AIRTABLE ALTERNATIVE</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-pill-1" transform="translate(945, 335)">
    <rect width="180" height="34" rx="17" fill="url(#badgeGrad4)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="4.5" fill="#fbbf24" />
    <text x="34" y="21" fill="#fde68a" class="text-pill">REST &amp; GRAPHQL APIS</text>
  </g>

  <!-- Central Foreground Content Container (Guaranteed foreground readability) -->
  <g>
    <!-- Central Accent Glow behind title -->
    <ellipse cx="600" cy="195" rx="340" ry="75" fill="#1e40af" fill-opacity="0.22" filter="url(#glow)" />

    <!-- Category Tag -->
    <g transform="translate(470, 78)">
      <rect width="260" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="130" y="18" fill="#38bdf8" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1.5">⚡ THE DEFINITIVE DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" text-anchor="middle" class="text-title" font-size="44" fill="#ffffff">
      Awesome <tspan fill="url(#neonGlow)">No-Code Database</tspan>
    </text>

    <!-- Subtitle -->
    <text x="600" y="205" text-anchor="middle" class="text-sub" font-size="16" fill="#cbd5e1" opacity="0.95" letter-spacing="0.3">
      Curated Ecosystem of Modern No-Code Databases, Spreadsheet–Databases &amp; Open-Source Engines
    </text>

    <!-- Feature Pill Badges Under Subtitle -->
    <g transform="translate(325, 238)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="165" height="30" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
      <text x="82" y="19" fill="#94a3b8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">🏢 SaaS Market Leaders</text>

      <!-- Item 2 -->
      <rect x="180" y="0" width="185" height="30" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
      <text x="272" y="19" fill="#94a3b8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">⭐ Open-Source Engines</text>

      <!-- Item 3 -->
      <rect x="380" y="0" width="170" height="30" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
      <text x="465" y="19" fill="#94a3b8" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">🔒 Zero Vendor Lock-In</text>
    </g>

    <!-- Bottom Accent Line -->
    <line x1="360" y1="305" x2="840" y2="305" stroke="url(#neonGlow)" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
